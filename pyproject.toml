[project]
name = "cad-cf-hybrid"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7", "requests>=2.31,<3"]
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "openai==1.102.0",
    "google-genai==1.68.0",
]
baseline = [
    "cssselect==1.3.0",
    "formulas==1.3.0",
    "gymnasium==0.28.1",
    "lxml==6.0.1",
    "numpy==1.26.4",
    "openpyxl==3.1.5",
    "pandas==2.3.2",
    "pillow==11.0.0",
    "playwright==1.55.0",
    "psutil==5.9.8",
    "pydrive==1.3.1",
    "python-dotenv==1.1.1",
    "requests-toolbelt==1.0.0",
    "tldextract==5.3.0",
    "tqdm==4.65.2",
    "xmltodict==0.14.2",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
